[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/bin/bash -c "PG_BIN=$(cat /tmp/pg_bin_path) && PG_DATA=$(cat /tmp/pg_data_path) && exec sudo -u postgres $PG_BIN/postgres -D $PG_DATA"
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -c "echo 'PORT is: '$PORT && ls -la /usr/share/nginx/html/ && envsubst '\$PORT' < /app/nginx.conf.template > /tmp/nginx.conf && cat /tmp/nginx.conf && exec /usr/sbin/nginx -c /tmp/nginx.conf -g 'daemon off;'"
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:java]
command=/bin/bash -c "echo 'Waiting for PostgreSQL...' && until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done && echo 'PostgreSQL ready, starting Java...' && sleep 5 && java -Xmx512m -Xms256m -XX:+UseG1GC -jar /app/app.jar"
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
