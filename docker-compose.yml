version: '3.8'

services:
  # Java Spring Boot Application
  stockpulse-java:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: stockpulse-java-final
    ports:
      - "8181:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/stockpulse
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - FINNHUB_API_KEY=d0f5oj9r01qsv9efh66gd0f5oj9r01qsv9efh670
      - JAVA_OPTS=-Xmx2g -Xms1g -XX:+UseG1GC
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend
  frontend:
    container_name: stockpulse-frontend
    build: 
      context: ./frontend
    ports:
      - "3010:3010"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - stockpulse-java
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API=http://localhost:8181
      - TSC_COMPILE_ON_ERROR=true
      - DISABLE_ESLINT_PLUGIN=true
      - PORT=3010
    stdin_open: true
    tty: true

  # PostgreSQL Database with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: stockpulse_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
      timeout: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: stockpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redis_data: